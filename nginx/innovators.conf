# Upstream Next.js Node cluster
upstream nextjs_cluster {
    server 127.0.0.1:3000;
    keepalive 64;
}

# 1. HTTP Server (Serves via Cloudflare or redirects to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name innovators-global.com www.innovators-global.com app.innovators-global.com;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;

    # Static assets caching
    location /_next/static/ {
        alias /var/www/innovators/.next/static/;
        expires 365d;
        access_log off;
    }

    location /public/ {
        alias /var/www/innovators/public/;
        expires 30d;
        access_log off;
    }

    # Main reverse proxy to Next.js
    location / {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
