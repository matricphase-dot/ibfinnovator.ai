# Upstream Next.js Node cluster
upstream nextjs_cluster {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP Server — Cloudflare terminates SSL, connects to origin via HTTP (Flexible)
# or HTTPS (Full/Strict). This config handles both.
server {
    listen 80;
    listen [::]:80;
    server_name innovators-global.com www.innovators-global.com app.innovators-global.com;

    # Large client header buffers (for large browser cookies)
    large_client_header_buffers 4 64k;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm;

    # Next.js static assets — reverse proxy to Next.js cluster with immutable caching
    # Bypassing raw disk alias prevents 404/403 HTML error pages and CSS MIME type blocking
    location /_next/static/ {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public folder assets
    location /public/ {
        alias /var/www/innovators/public/;
        expires 30d;
        access_log off;
    }

    # Favicon, manifest, robots — serve from public
    location = /favicon.ico {
        root /var/www/innovators/public;
        access_log off;
    }

    # Health check endpoint (for monitoring)
    location = /api/health {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Main reverse proxy to Next.js
    location / {
        proxy_pass http://nextjs_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;

        # Real client IP behind Cloudflare (fallback to remote_addr if direct/local)
        set $real_client_ip $http_cf_connecting_ip;
        if ($real_client_ip = "") {
            set $real_client_ip $remote_addr;
        }
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Forward Cloudflare HTTPS protocol to Next.js (fallback to scheme if direct)
        set $forwarded_proto $http_x_forwarded_proto;
        if ($forwarded_proto = "") {
            set $forwarded_proto $scheme;
        }
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;

        # Upstream header & buffer limits (PREVENTS 502 Bad Gateway on large Next.js headers/cookies)
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # WebSocket support (for Supabase Realtime)
        proxy_buffering off;
    }

    # Block dotfiles (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
    }
}
